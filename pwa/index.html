<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b6b5f" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Lauttasaari-tutka</title>
  <style>
    :root {
      --bg: #f6f7f8; --card: #fff; --ink: #14201e; --muted: #67736f;
      --brand: #0b6b5f; --brand-ink: #fff; --line: #e5e8e7;
      --plus: #0b6b5f; --warn: #b26a00; --pill: #eef2f1;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0e1413; --card:#161d1c; --ink:#e8eeec; --muted:#93a09c;
        --brand:#38b39f; --brand-ink:#04140f; --line:#26302e; --pill:#1c2524; }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin:0; font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:var(--bg); color:var(--ink); }
    header { position:sticky; top:0; z-index:5; background:var(--brand); color:var(--brand-ink);
      padding:14px 16px calc(14px + env(safe-area-inset-top)); padding-top:max(14px,env(safe-area-inset-top)); }
    header h1 { margin:0; font-size:19px; letter-spacing:.2px; display:flex; align-items:center; gap:8px; }
    header .meta { font-size:12.5px; opacity:.9; margin-top:3px; }
    .tabs { display:flex; gap:6px; padding:10px 12px; overflow-x:auto; position:sticky; top:64px; z-index:4;
      background:var(--bg); border-bottom:1px solid var(--line); }
    .tab { flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--ink);
      padding:7px 13px; border-radius:999px; font-size:13.5px; font-weight:600; }
    .tab.active { background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }
    main { padding:12px 12px 40px; max-width:680px; margin:0 auto; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px;
      margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
    .card.dim { opacity:.5; }
    .row1 { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
    .price { font-size:20px; font-weight:800; white-space:nowrap; }
    .specs { color:var(--muted); font-size:14px; font-weight:600; }
    .addr { margin:6px 0 2px; font-weight:600; }
    .badges { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 4px; }
    .pill { background:var(--pill); color:var(--ink); border-radius:999px; padding:3px 9px; font-size:12px; font-weight:600; }
    .pill.plus { color:var(--plus); }
    .pill.warn { color:var(--warn); }
    .pill.src { border:1px solid var(--line); background:transparent; }
    .links { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .btn { flex:1; text-align:center; text-decoration:none; border-radius:10px; padding:9px 10px; font-size:13.5px;
      font-weight:700; border:1px solid var(--line); color:var(--brand); background:var(--card); }
    .btn.brand { background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }
    .actions { display:flex; gap:8px; margin-top:8px; }
    .act { flex:1; border:1px solid var(--line); background:var(--card); color:var(--muted);
      border-radius:10px; padding:9px; font-size:13.5px; font-weight:700; }
    .act.on-like { background:#0b6b5f14; color:var(--plus); border-color:var(--plus); }
    .act.on-hide { background:#b26a0014; color:var(--warn); border-color:var(--warn); }
    .empty { text-align:center; color:var(--muted); padding:50px 20px; }
    footer { text-align:center; color:var(--muted); font-size:12px; padding:10px; }
  </style>
</head>
<body>
  <header>
    <h1>🛰️ Lauttasaari-tutka</h1>
    <div class="meta" id="meta">Ladataan…</div>
  </header>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-f="all">Kaikki</button>
    <button class="tab" data-f="like">❤️ Kiinnostaa</button>
    <button class="tab" data-f="new">✨ Uudet</button>
    <button class="tab" data-f="balcony">🌿 Parveke</button>
    <button class="tab" data-f="hide">🗑️ Piilotetut</button>
  </nav>
  <main id="list"><div class="empty">Ladataan kohteita…</div></main>
  <footer id="foot"></footer>

  <script>
    const LS = { like:"lt_like", hide:"lt_hide" };
    const get = k => JSON.parse(localStorage.getItem(k) || "{}");
    const set = (k,v) => localStorage.setItem(k, JSON.stringify(v));
    const keyOf = l => (l.address.split(",")[0] + "|" + Math.round(l.size||0)).toLowerCase().replace(/[^a-zåäö0-9|]/g,"");
    let data = { listings:[], updatedAt:null }, filter = "all";

    function fmtAgo(iso){
      if(!iso) return "";
      const d = (Date.now()-new Date(iso))/36e5;
      if (d<1) return Math.round(d*60)+" min sitten";
      if (d<24) return Math.round(d)+" h sitten";
      return Math.round(d/24)+" pv sitten";
    }

    function render(){
      const likes = get(LS.like), hides = get(LS.hide);
      let items = data.listings.map(l => ({...l, _k:keyOf(l)}));
      if (filter==="like") items = items.filter(l=>likes[l._k]);
      else if (filter==="hide") items = items.filter(l=>hides[l._k]);
      else if (filter==="balcony") items = items.filter(l=>l.balcony && !hides[l._k]);
      else if (filter==="new") items = items.filter(l=>l._isNew && !hides[l._k]);
      else items = items.filter(l=>!hides[l._k]);

      const el = document.getElementById("list");
      if (!items.length){ el.innerHTML = '<div class="empty">Ei kohteita tässä näkymässä.</div>'; return; }
      el.innerHTML = items.map(l => card(l, likes[l._k], hides[l._k])).join("");
    }

    function card(l, liked, hidden){
      const specs = [ (l.rooms!=null?l.rooms+"h":"?h"), (l.size!=null?l.size+" m²":""), ].filter(Boolean).join(" · ");
      const price = l.rent!=null ? l.rent+" €/kk" : "? €/kk";
      const badges = [];
      if (l.balcony) badges.push('<span class="pill plus">🌿 parveke</span>');
      if (l.parking) badges.push('<span class="pill plus">🅿️ autopaikka</span>');
      if (l.pets==="sallittu") badges.push('<span class="pill plus">🐾 lemmikit ok</span>');
      else if (l.pets==="kielletty?") badges.push('<span class="pill warn">🐾 lemmikit epävarma</span>');
      if (l._isNew) badges.push('<span class="pill" style="color:var(--brand)">✨ uusi</span>');
      (l.sources||[{source:l.source,url:l.url}]).forEach(s=>badges.push(`<span class="pill src">${s.source}</span>`));

      const maps = `https://www.google.com/maps/search/${encodeURIComponent(l.address)}`;
      const links = (l.sources||[{source:l.source,url:l.url}])
        .map((s,i)=>`<a class="btn ${i===0?'brand':''}" href="${s.url}" target="_blank" rel="noopener">Avaa · ${s.source}</a>`).join("");

      const avail = l.availableFrom ? `<div class="specs" style="font-size:12.5px">📅 vapautuu ${l.availableFrom}</div>` : "";

      return `<div class="card ${hidden?'dim':''}">
        <div class="row1"><div class="specs">${specs}</div><div class="price">${price}</div></div>
        <div class="addr">${l.address}</div>
        ${avail}
        <div class="specs" style="font-weight:400;font-size:12.5px">${l.title||""}</div>
        <div class="badges">${badges.join("")}</div>
        <div class="links">${links}<a class="btn" href="${maps}" target="_blank" rel="noopener">🗺️ Kartta</a></div>
        <div class="actions">
          <button class="act ${liked?'on-like':''}" onclick="toggle('${LS.like}','${l._k}')">❤️ Kiinnostaa</button>
          <button class="act ${hidden?'on-hide':''}" onclick="toggle('${LS.hide}','${l._k}')">🗑️ Piilota</button>
        </div>
      </div>`;
    }

    window.toggle = (store, k) => {
      const cur = get(store); if (cur[k]) delete cur[k]; else cur[k]=Date.now(); set(store,cur); render();
    };

    document.getElementById("tabs").addEventListener("click", e => {
      const b = e.target.closest(".tab"); if(!b) return;
      document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
      b.classList.add("active"); filter = b.dataset.f; render();
    });

    async function load(){
      try {
        const r = await fetch("listings.json?t="+Date.now());
        data = await r.json();
        // merkitse "uudet": julkaistu tai ensinäkyvä < 3 vrk
        const now = Date.now();
        data.listings.forEach(l => { l._isNew = l.published ? (now-new Date(l.published))/36e5 < 72 : false; });
        document.getElementById("meta").textContent =
          `${data.count} kohdetta · päivitetty ${fmtAgo(data.updatedAt)}`;
        document.getElementById("foot").textContent = "Lähteet: Oikotie, Vuokraovi, Qasa · kriteerit 3h+ · 55 m²+ · ≤1800 €";
        render();
      } catch(e){
        document.getElementById("list").innerHTML =
          '<div class="empty">Ei saatu ladattua kohteita.<br><small>'+e.message+'</small></div>';
      }
    }
    load();
    setInterval(load, 5*60*1000);
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
  </script>
</body>
</html>
